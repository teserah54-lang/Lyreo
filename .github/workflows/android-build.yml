name: Android Build (Lyreon APK)

on:
  push:
    branches: [main, arena/*]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write diperlukan agar step "Report Build Errors" bisa
    # memposting komentar commit (default token hanya read → HTTP 403).
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.x butuh JDK 21 untuk berjalan (D8 Java-25 bytecode).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # Versi Gradle hanya didefinisikan di gradle-wrapper.properties
      # (single source of truth) — upgrade Gradle tak perlu edit workflow ini.
      - name: Resolve Gradle Version
        id: gv
        run: echo "version=$(grep -oP 'gradle-\K[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle ${{ steps.gv.outputs.version }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}
          cache-read-only: false

      # Repo tidak menyimpan gradle-wrapper.jar — CI memakai binary `gradle`
      # dari setup-gradle (versi = gradle-wrapper.properties) TANPA wrapper,
      # agar error konfigurasi apa pun terekam ke build-debug.log dan
      # otomatis terlapor sebagai komentar commit.
      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain --stacktrace --no-daemon 2>&1 | tee build-debug.log

      # Jika build debug gagal, posting ringkasan sebagai komentar commit
      # supaya agen/bot bisa membaca detail error lewat GitHub API.
      - name: Report Debug Build Errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### ❌ Build DEBUG gagal — ringkasan error:'
            echo '```'
            grep -E "^e: |error:|Unresolved|FAILED$" build-debug.log | head -n 100
            echo '---- tail log ----'
            tail -n 40 build-debug.log
            echo '```'
          } > report.md || true
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@report.md --jq .html_url || true

      # Debug diupload DULU — walau release nanti gagal, APK debug tetap ada.
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lyreon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Release (R8 full optimize = performa jauh lebih smooth daripada debug).
      # TIDAK continue-on-error: kalau release gagal, run ditandai merah dan
      # ringkasan error terlapor sebagai komentar commit (visibilitas penuh).
      - name: Build Release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --console=plain --stacktrace --no-daemon 2>&1 | tee build-release.log

      - name: Report Release Build Errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### ❌ Build RELEASE (R8) gagal — ringkasan error:'
            echo '```'
            grep -E "^e: |error:|Unresolved|FAILED|Missing class|Warning" build-release.log | head -n 120
            echo '---- tail log ----'
            tail -n 60 build-release.log
            echo '```'
          } > report.md || true
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@report.md --jq .html_url || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: lyreon-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
